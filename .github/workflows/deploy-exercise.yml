name: Deploy Exercise

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-exercise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check routine and build
        run: |
          npm --prefix exercise run typecheck
          npm --prefix exercise test
          npm --prefix exercise run build
          test -s exercise/build/index.html
      - name: Deploy exercise
        working-directory: exercise
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../node_modules/.bin/wrangler pages deploy build --project-name chriswiki-exercise --branch main
      - name: Verify HTTPS
        run: |
          curl --fail --retry 3 https://exercise.chriswiki.com/ -o /tmp/exercise.html
          grep -q 'Exercise — Christian Wilkins' /tmp/exercise.html
          echo 'Published: https://exercise.chriswiki.com' >> "$GITHUB_STEP_SUMMARY"
