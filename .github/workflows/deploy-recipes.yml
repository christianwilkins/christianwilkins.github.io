name: Deploy Recipes

on:
  workflow_dispatch:
    inputs:
      recipe_commit:
        description: Full commit SHA from christianwilkins/recipes to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-recipes-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate recipe commit
        env:
          RECIPE_COMMIT: ${{ inputs.recipe_commit }}
        run: |
          if [[ ! "$RECIPE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Provide a full lowercase Git commit SHA.' >&2
            exit 1
          fi

      - name: Check out the requested recipe revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: christianwilkins/recipes
          ref: ${{ inputs.recipe_commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Validate content and build
        run: |
          npm run check
          npm test
          npm run build
          npm run check:functions
          test -s dist/index.html
          test -s dist/protein-banana-pudding/index.html
          test -s dist/biscoff-protein-cheesecake-bowl/index.html
          test -s dist/shopping/index.html
          test -s dist/groceries.js
          test -s functions/api/groceries/\[\[path\]\].js

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prepare shared grocery database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:provision
          npm run db:migrate

      - name: Deploy recipes and grocery API
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.142.0'
          command: pages deploy dist --project-name=chriswiki-recipes --branch=main

      - name: Verify published content
        run: |
          node --input-type=module <<'JS'
          const checks = [
            ['/protein-banana-pudding/', text => text.includes('Protein banana pudding')],
            ['/biscoff-protein-cheesecake-bowl/', text => text.includes('Biscoff protein cheesecake bowl')],
            ['/shopping/', text => text.includes('Anyone with this page can edit')],
            ['/api/groceries', text => Array.isArray(JSON.parse(text).items)]
          ];
          for (const [path, matches] of checks) {
            let passed = false;
            for (let attempt = 0; attempt < 10; attempt++) {
              try {
                const response = await fetch(`https://chriswiki-recipes.pages.dev${path}`, {signal: AbortSignal.timeout(15000)});
                if (response.ok && matches(await response.text())) { passed = true; break; }
              } catch { /* Retry while the new deployment reaches the edge. */ }
              if (attempt < 9) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!passed) throw new Error(`Published content check failed: ${path}`);
            console.log(`Verified ${path}`);
          }
          JS
          echo 'Published recipes: https://recipes.chriswiki.com' >> "$GITHUB_STEP_SUMMARY"
