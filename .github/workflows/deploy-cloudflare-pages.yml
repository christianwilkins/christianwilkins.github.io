name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/dev-ui-ux-release
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npm run deploy:cloudflare
          else
            npx wrangler pages deploy dist --project-name chriswiki --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify development preview
        if: github.ref_name == 'feature/dev-ui-ux-release'
        run: |
          preview_url="https://feature-dev-ui-ux-release.chriswiki.pages.dev"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$preview_url" -o "$RUNNER_TEMP/preview.html"
          grep -q 'id="root"' "$RUNNER_TEMP/preview.html"
          printf 'Development preview: %s\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"
